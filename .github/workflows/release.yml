name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # See the note in ci.yml — a Windows-generated lock breaks `npm ci` on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

      # The build regenerates browser/ and the flattened stylesheets, which are
      # committed. If they differ from what's tagged, the tag doesn't match its
      # own source and the CDN would serve something nobody reviewed.
      - name: Verify committed build artifacts match the source
        run: |
          if [ -n "$(git status --porcelain browser/)" ]; then
            echo "browser/ differs from a fresh build of this tag:"
            git --no-pager diff --stat browser/
            exit 1
          fi

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
