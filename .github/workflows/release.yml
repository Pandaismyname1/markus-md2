name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA-pinned rather than tag-pinned: a mutable tag on a third-party action
      # is a supply-chain hole, and Dependabot's github-actions ecosystem keeps
      # these current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # See the note in ci.yml — a Windows-generated lock breaks `npm ci` on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

      # browser/ is committed because jsDelivr serves it straight from the tag.
      # If it doesn't match a fresh build of this commit, the CDN would serve
      # code that nobody reviewed.
      - name: Verify the committed bundle matches a fresh build
        run: |
          if [ -n "$(git status --porcelain browser/)" ]; then
            echo "browser/ differs from a fresh build of this tag:"
            git --no-pager diff --stat browser/
            exit 1
          fi

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Distribution is GitHub only — the tag itself is the artifact, served by
      # jsDelivr and installable with `npm install github:…#<tag>`. The files
      # below are attached so a consumer can download a pinned copy without a
      # CDN or a clone. Idempotent so a re-run after a partial failure finishes.
      - name: Create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets with --clobber."
            gh release upload "$GITHUB_REF_NAME" \
              browser/md2.js browser/md2.css browser/md2.standalone.css \
              dist/md2.bundle.css dist/md2.standalone.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
              browser/md2.js browser/md2.css browser/md2.standalone.css \
              dist/md2.bundle.css dist/md2.standalone.css
          fi
        env:
          GH_TOKEN: ${{ github.token }}
