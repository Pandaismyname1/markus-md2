name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Vitest 4's bundler imports `styleText` from node:util, which needs
        # 20.12+, so the test runner can't run on 18 even though the library
        # can. Node 18 is covered by the smoke job below instead of being
        # quietly dropped from the support promise in `engines`.
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm install`, not `npm ci`: npm resolves optional platform packages
      # differently per OS, so a lock file generated on Windows is missing
      # entries Linux needs (@emnapi/*, via rolldown's wasm binding) and `npm ci`
      # refuses to proceed. The lock stays committed for local reproducibility;
      # CI resolving fresh also surfaces upstream breakage early.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

      # browser/ is committed because jsDelivr serves it straight from git —
      # a stale bundle is served to real pages the moment it lands on main.
      # Every bundled dependency (unified, remark-*, prismjs…) is exactly what
      # Dependabot bumps, so without this check those PRs go green while the
      # bundle rots, and the problem only surfaces at release time.
      - name: Verify the committed bundle matches a fresh build
        if: matrix.node == 20
        run: |
          if [ -n "$(git status --porcelain browser/)" ]; then
            echo "browser/ differs from a fresh build. Run 'npm run build' and commit the result."
            git --no-pager diff --stat browser/
            git status --porcelain browser/
            exit 1
          fi

  # `engines` promises Node 18, so prove the built package actually runs there.
  # This is a real check, not a formality: the compiler is what ships, and it
  # must import and produce correct output on the oldest version we claim.
  smoke-node18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      - name: Compile a document on Node 18
        run: |
          node --version
          node -e "
            import('./dist/index.js').then(async (m) => {
              const html = await m.compileMd2(':::callout{severity=blocking title=T}\nBody.\n:::');
              if (!html.includes('md2-callout-blocking')) { throw new Error('unexpected output: ' + html); }
              const { source } = m.upgradeMarkdown('> **Note:** hi');
              if (!source.startsWith(':::callout')) { throw new Error('upgrade failed: ' + source); }
              console.log('Node 18 smoke test passed');
            }).catch((err) => { console.error(err); process.exit(1); });
          "
